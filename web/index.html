<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolfram WebSocket bridge</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<style>
  :root { --bg: #fbfbfa; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --accent: #b3261e; --ok: #1f6f43; --code: #f1f1ed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #e9e9e4; --muted: #9a9a93; --line: #34342f; --accent: #f08a7e; --ok: #7fd1a1; --code: #20201e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  a { color: inherit; text-underline-offset: 2px; }
  header a, .more { font-size: 13px; color: var(--muted); }
  .more { align-self: center; }
  .notice { font-size: 13px; margin: 0 0 8px; }
  .status { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; min-width: 0; min-height: 64px; padding: 8px; font: 14px/1.4 ui-monospace, monospace; background: var(--code);
             color: var(--fg); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  button { padding: 0 18px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--fg); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 8px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 20px; }
  .examples button { padding: 2px 8px; font: 12px/1.5 ui-monospace, monospace; background: var(--code); color: var(--fg); max-width: 100%;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry { border-top: 1px solid var(--line); padding: 12px 0; }
  .in, .out, .code { font: 14px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .in { color: var(--muted); }
  .out { margin-top: 4px; }
  /* typeset result: a long formula scrolls inside its entry instead of widening the page */
  .math { margin-top: 2px; overflow-x: auto; overflow-y: hidden; }
  .math .katex-display { margin: 4px 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .math .katex-display.fleqn > .katex { padding-left: 0; }
  .code { color: var(--muted); font-size: 12px; margin-top: 2px; }
  /* pictures sit on white, so that black axes and labels stay readable on a dark page */
  .picture { display: inline-block; max-width: 100%; margin-top: 6px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .picture img { display: block; max-width: 100%; height: auto; }
  .picture img.pixels { image-rendering: pixelated; }
  .err { color: var(--accent); }
  .msg { color: var(--accent); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
  /* input language switch: two toggle buttons, the pressed one filled */
  .modes { display: inline-flex; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes button { padding: 3px 12px; font-size: 13px; border: 0; border-radius: 0; background: transparent; color: var(--fg); }
  .modes button + button { border-left: 1px solid var(--line); }
  .modes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions button { flex: 1; }
  #stop { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  /* a JavaScript run: its output lines and shown results, in order, under the code */
  .entry.js > .in { max-height: 16em; overflow-y: auto; }
  .shown { margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Wolfram WebSocket bridge</h1>
    <a id="examples-link" href="examples.html">JavaScript examples →</a>
  </header>
  <div class="status" id="status" role="status">Loading…</div>
  <div class="modes" id="modes" role="group" aria-label="Input language">
    <button type="button" data-mode="wl" aria-pressed="true">Wolfram</button>
    <button type="button" data-mode="js" aria-pressed="false">JavaScript</button>
  </div>
  <form id="form">
    <textarea id="input" spellcheck="false" aria-label="Wolfram Language input" aria-describedby="hint">Integrate[x^2 Sin[x], x]</textarea>
    <div class="actions">
      <button id="go" disabled>Evaluate</button>
      <button id="stop" type="button" disabled hidden>Stop</button>
    </div>
  </form>
  <div class="hint" id="hint">Ctrl+Enter evaluates. Input is sent as WXF; definitions stay in the kernel. Reload the page to abort an evaluation.</div>
  <div class="notice err" id="notice" role="status" hidden></div>
  <div class="examples" id="examples"></div>
  <a id="more-examples" class="more" href="examples.html" hidden>More examples →</a>
  <div id="log" aria-live="polite"></div>
</main>
<script type="module">
import {
  codeOfFragment, connect, connected, currentRun, displayOf, line, renderReply, socket, startRun, stopRun, wxf,
} from './page.js'

const $ = id => document.getElementById(id)
const status = text => { $('status').textContent = text }

// links to the examples page keep the query (the token); the one after the JavaScript
// examples moves with them
const more = $('more-examples')
$('examples-link').href = more.href = `examples.html${location.search}`

// ---- input modes ----

const JS_EXAMPLES = [
  ['W expressions', `const x = W.x
// W.f(...) is f[...]; a returned expression is evaluated and shown
return W.Integrate(W.Times(W.Power(x, 2), W.Sin(x)), x)`],
  ['wl and templates', `const p = await wl('Expand[(x - 1) (x - 2) (x - 3)]')
console.log('p =', p)
// \${...} inserts a value as Wolfram Language text
return wl\`Solve[\${p} == 0, x]\``],
  ['show plots', `for (const n of [1, 2, 3]) {
  await show(\`Plot[Sin[\${n} x], {x, 0, 2 Pi}]\`)
}`],
  ['toJS', `const m = await wl('Inverse[{{2., 1.}, {1., 3.}}]')
return toJS(m)   // nested arrays of numbers`],
  ['errors', `try {
  await wl('Integrate[')
} catch (err) {
  console.warn(err.failure, '-', err.message)
}`],
  ['endless loop', `let i = 0
while (true) i++   // press Stop`],
]
const MODES = {
  wl: {
    label: 'Wolfram Language input',
    run: 'Evaluate',
    hint: "Ctrl+Enter evaluates. Input is sent as WXF; definitions stay in the kernel. Reload the page to abort an evaluation.",
    draft: $('input').value,
    examples: ['Solve[x^3 - 6 x^2 + 11 x - 6 == 0, x]', 'Series[Tan[x], {x, 0, 9}]', 'Inverse[{{a, b}, {c, d}}]',
      'Plot[{Sin[x], Cos[x]}, {x, 0, 2 Pi}]', 'Plot3D[Sin[x y], {x, 0, 3}, {y, 0, 3}]', 'N[Pi, 50]'].map(e => [e, e]),
  },
  js: {
    label: 'JavaScript input',
    run: 'Run',
    hint: 'Ctrl+Enter runs the code as the body of an async function, in a worker that cannot reach the page: ' +
      'W.Sin(W.x) builds Sin[x], await wl(expr) evaluates (a string is Wolfram Language text), show(expr) shows a result, ' +
      'console.log prints, a returned value is shown. Stop ends a run.',
    draft: JS_EXAMPLES[0][1],
    examples: JS_EXAMPLES,
  },
}

// the mode is remembered per viewer; storage may be unavailable (private windows, blocked site data)
const stored = key => { try { return localStorage.getItem(key) } catch { return null } }
const store = (key, value) => { try { localStorage.setItem(key, value) } catch {} }

let mode = 'wl'
let busy = false     // an evaluation or a run is in progress: one at a time

function setMode(next, remember = true) {
  if (next !== mode) {
    MODES[mode].draft = $('input').value   // each mode keeps its own text
    $('input').value = MODES[next].draft
    mode = next
  }
  if (remember) store('wsb-mode', mode)
  for (const b of $('modes').children) b.setAttribute('aria-pressed', String(b.dataset.mode === mode))
  $('input').setAttribute('aria-label', MODES[mode].label)
  $('go').textContent = MODES[mode].run
  $('hint').textContent = MODES[mode].hint
  $('examples').replaceChildren(...MODES[mode].examples.map(([text, code]) => {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = text
    if (code !== text) b.title = code
    b.onclick = () => { $('input').value = code; $('input').focus() }
    return b
  }))
  more.hidden = mode !== 'js'
  if (mode === 'js') $('examples').append(more)
  updateButtons()
}

function updateButtons() {
  $('go').disabled = busy || !connected()
  $('stop').hidden = mode !== 'js' && !currentRun()   // a run started in JavaScript mode stays stoppable
  $('stop').disabled = !currentRun()
}

for (const b of $('modes').children) b.onclick = () => setMode(b.dataset.mode)
setMode(stored('wsb-mode') === 'js' ? 'js' : 'wl', false)

// Code from a link (#js=..., from the examples page) goes into the JavaScript mode's editor and is
// never run: the reader looks at it and presses Run. The fragment is removed, so that a reload
// does not replace what they typed since.
function loadFragment() {
  const found = codeOfFragment(location.hash)
  if (!found) return
  history.replaceState(null, '', location.pathname + location.search)
  $('notice').textContent = found.error || ''
  $('notice').hidden = !found.error
  if (found.error) return
  setMode('js')
  $('input').value = found.code
  $('input').focus()
}
loadFragment()
window.addEventListener('hashchange', loadFragment)

// ---- results ----

function addEntry(input) {
  const entry = document.createElement('div')
  entry.className = 'entry'
  line(entry, 'in', input)
  $('log').prepend(entry)
  return entry
}

async function evaluateWL(input) {
  const start = performance.now()
  let reply, sent = 0, ms = 0
  try {
    reply = await socket.evaluate(input)
    sent = wxf.encode(input).length
    ms = Math.round(performance.now() - start)
  } catch (err) {
    reply = { success: false, failure: 'Error', message: err.message, symbols: [] }
  }
  const entry = addEntry(input)
  renderReply(entry, entry, displayOf(reply), input, [`${sent} bytes sent`], [`${ms} ms round trip`])
}

// a JavaScript run (page.js): its output lines and shown results, then a meta line, under the code
function runJS(code) {
  const entry = addEntry(code)
  entry.classList.add('js')
  const output = document.createElement('div')
  entry.append(output)
  const meta = line(entry, 'meta', '')
  startRun(code, { owner: entry, output, meta, ended: () => { busy = false; updateButtons() } })
  updateButtons()
}

$('stop').onclick = () => {
  stopRun()
  $('input').focus()   // the Stop button is now disabled: keep the keyboard focus on the page's input
}

// ---- connection ----

if (await connect(status, updateButtons)) {
  const run = () => {
    const input = $('input').value.trim()
    if (!input || busy || $('go').disabled) return
    busy = true
    $('notice').hidden = true
    if (mode === 'js') return runJS(input)
    updateButtons()
    evaluateWL(input).finally(() => { busy = false; updateButtons() })
  }
  $('form').onsubmit = e => { e.preventDefault(); run() }
  $('input').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run() } }
}
</script>
</body>
</html>
